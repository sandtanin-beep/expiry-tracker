<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ทดสอบสแกนบาร์โค้ด</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#111;color:#fff;padding:16px;min-height:100vh}
h2{font-size:17px;margin-bottom:14px;text-align:center}
button{display:block;width:100%;padding:13px;margin-bottom:8px;font-size:14px;border-radius:10px;border:none;cursor:pointer;font-weight:600}
.btn-primary{background:#fff;color:#111}
.btn-stop{background:#333;color:#fff}
video{width:100%;border-radius:10px;background:#000;display:block;margin:12px 0}
canvas{width:100%;border-radius:10px;display:none;margin:8px 0}
#result{background:#1a1a1a;border-radius:10px;padding:12px;font-size:13px;min-height:60px;margin-top:8px;white-space:pre-wrap;word-break:break-all;line-height:1.6}
.ok{color:#7CCA5A}
.err{color:#FF6B6B}
.info{color:#FFD166}
</style>
</head>
<body>
<h2>🔍 ทดสอบสแกนบาร์โค้ด</h2>

<button class="btn-primary" onclick="testBarcodeDetector()">วิธี 1: BarcodeDetector API</button>
<button class="btn-primary" onclick="testCanvasDecode()">วิธี 2: Canvas + BarcodeDetector</button>
<button class="btn-primary" onclick="testInputCapture()">วิธี 3: Input type=file (ถ่ายรูปแล้วอ่าน)</button>
<button class="btn-stop" onclick="stopAll()">⏹ หยุดทั้งหมด</button>

<video id="vid" autoplay playsinline muted></video>
<canvas id="cvs"></canvas>
<input type="file" id="file-input" accept="image/*" capture="environment" style="display:none" onchange="handleFileInput(this)">
<div id="result">กดปุ่มเพื่อทดสอบ...</div>

<script>
let stream = null;
let scanLoop = null;
const log = (msg, type='') => {
  document.getElementById('result').innerHTML += `<span class="${type}">${msg}</span>\n`;
};
const clearLog = () => { document.getElementById('result').innerHTML = ''; };

async function stopAll(){
  if(scanLoop){ clearInterval(scanLoop); scanLoop=null; }
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  document.getElementById('vid').srcObject=null;
  log('⏹ หยุดแล้ว','info');
}

async function openCam(){
  await stopAll();
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
  }catch(e){
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{exact:'environment'}},audio:false});
  }
  document.getElementById('vid').srcObject = stream;
  return stream;
}

async function testBarcodeDetector(){
  clearLog();
  log('ทดสอบ BarcodeDetector API...','info');
  if(!('BarcodeDetector' in window)){
    log('✗ BarcodeDetector ไม่รองรับในเบราว์เซอร์นี้','err');
    return;
  }
  log('✓ BarcodeDetector รองรับ','ok');
  try{
    await openCam();
    log('✓ กล้องเปิดได้','ok');
    const bd = new BarcodeDetector({formats:['ean_13','ean_8','code_128','code_39','upc_a','upc_e','qr_code','data_matrix']});
    const vid = document.getElementById('vid');
    log('กำลังสแกน... จ่อบาร์โค้ดให้ตรงกล้อง','info');
    scanLoop = setInterval(async()=>{
      if(vid.readyState === vid.HAVE_ENOUGH_DATA){
        try{
          const results = await bd.detect(vid);
          if(results.length > 0){
            clearInterval(scanLoop);
            stopAll();
            log(`✓ สแกนได้! รหัส: ${results[0].rawValue}`,'ok');
            log(`รูปแบบ: ${results[0].format}`,'ok');
          }
        }catch(e){}
      }
    }, 300);
  }catch(e){
    log('✗ เกิดข้อผิดพลาด: '+e.message,'err');
  }
}

async function testCanvasDecode(){
  clearLog();
  log('ทดสอบ Canvas + BarcodeDetector...','info');
  if(!('BarcodeDetector' in window)){
    log('✗ BarcodeDetector ไม่รองรับ','err');
    return;
  }
  try{
    await openCam();
    const vid = document.getElementById('vid');
    const cvs = document.getElementById('cvs');
    cvs.style.display='block';
    const ctx = cvs.getContext('2d');
    const bd = new BarcodeDetector({formats:['ean_13','ean_8','code_128','code_39','upc_a','upc_e','qr_code']});
    log('กำลังสแกนผ่าน Canvas... จ่อบาร์โค้ด','info');
    scanLoop = setInterval(async()=>{
      if(vid.readyState === vid.HAVE_ENOUGH_DATA){
        cvs.width = vid.videoWidth;
        cvs.height = vid.videoHeight;
        ctx.drawImage(vid,0,0);
        try{
          const results = await bd.detect(cvs);
          if(results.length > 0){
            clearInterval(scanLoop);
            stopAll();
            cvs.style.display='none';
            log(`✓ สแกนได้! รหัส: ${results[0].rawValue}`,'ok');
          }
        }catch(e){}
      }
    }, 300);
  }catch(e){
    log('✗ เกิดข้อผิดพลาด: '+e.message,'err');
  }
}

function testInputCapture(){
  clearLog();
  log('ทดสอบถ่ายรูปแล้วอ่านบาร์โค้ด...','info');
  log('จะเปิดกล้องให้ถ่ายรูปบาร์โค้ด','info');
  document.getElementById('file-input').click();
}

async function handleFileInput(input){
  if(!input.files[0]) return;
  log('ได้รูปมาแล้ว กำลังอ่าน...','info');
  if(!('BarcodeDetector' in window)){
    log('✗ BarcodeDetector ไม่รองรับ ไม่สามารถอ่านจากรูปได้','err');
    return;
  }
  const img = new Image();
  img.onload = async()=>{
    const cvs = document.getElementById('cvs');
    cvs.width=img.width; cvs.height=img.height;
    cvs.getContext('2d').drawImage(img,0,0);
    cvs.style.display='block';
    try{
      const bd = new BarcodeDetector({formats:['ean_13','ean_8','code_128','code_39','upc_a','upc_e','qr_code']});
      const results = await bd.detect(cvs);
      if(results.length > 0){
        log(`✓ สแกนได้! รหัส: ${results[0].rawValue}`,'ok');
        log(`รูปแบบ: ${results[0].format}`,'ok');
      } else {
        log('✗ ไม่พบบาร์โค้ดในภาพ ลองถ่ายใหม่ให้ชัดขึ้น','err');
      }
    }catch(e){
      log('✗ เกิดข้อผิดพลาด: '+e.message,'err');
    }
  };
  img.src = URL.createObjectURL(input.files[0]);
}

// ข้อมูลเบื้องต้น
log('Browser: '+(navigator.userAgent.includes('iPhone')?'iPhone Safari':navigator.userAgent.includes('Android')?'Android':'Desktop'),'info');
log('BarcodeDetector: '+('BarcodeDetector' in window ? '✓ รองรับ':'✗ ไม่รองรับ'),'BarcodeDetector' in window?'ok':'err');
log('getUserMedia: '+(!!navigator.mediaDevices?.getUserMedia?'✓ รองรับ':'✗ ไม่รองรับ'),!!navigator.mediaDevices?.getUserMedia?'ok':'err');
</script>
</body>
</html>

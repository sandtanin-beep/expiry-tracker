<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="เช็คสินค้า">
<meta name="theme-color" content="#1a1a1a">
<title>ระบบเช็ควันหมดอายุ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f4f3ef;--card:#fff;--surface:#f0efe9;--surface2:#e8e7e1;
  --text:#1a1a1a;--muted:#666;--hint:#aaa;
  --border:rgba(0,0,0,0.09);--border2:rgba(0,0,0,0.16);
  --green:#3B6D11;--green-bg:#EAF3DE;--green-mid:#639922;
  --amber:#854F0B;--amber-bg:#FAEEDA;--amber-mid:#EF9F27;
  --red:#A32D2D;--red-bg:#FCEBEB;--red-mid:#E24B4A;
  --blue:#185FA5;--blue-bg:#E6F1FB;
  --accent:#1a1a1a;
  --r:14px;--rs:9px;--font:'Sarabun',sans-serif
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.page{display:none;min-height:100vh;flex-direction:column}
.page.active{display:flex}

/* ── TOPBAR ── */
.topbar{background:var(--card);border-bottom:.5px solid var(--border);padding:14px 16px 12px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px}
.topbar h2{font-size:17px;font-weight:600;flex:1}
.topbar-sub{font-size:12px;color:var(--muted);margin-top:1px}
.btn-back{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text);padding:2px 6px 2px 0}
.btn-text{background:none;border:none;font-family:var(--font);font-size:14px;color:var(--blue);cursor:pointer;padding:4px 0}

/* ── BUTTONS ── */
.btn{display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--font);font-size:15px;font-weight:600;padding:13px;border-radius:var(--rs);border:none;cursor:pointer;transition:opacity .15s}
.btn:active{opacity:.75}
.btn-primary{background:var(--accent);color:#fff;width:100%}
.btn-outline{background:var(--card);color:var(--text);border:.5px solid var(--border2);width:100%}
.btn-sm{font-size:13px;padding:8px 14px;border-radius:8px}
.btn-danger{background:var(--red-bg);color:var(--red);border:.5px solid #F7C1C1}

/* ── FORM ── */
.field{margin-bottom:14px}
.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px;font-weight:500}
.field input,.field select,.field textarea{width:100%;font-family:var(--font);font-size:16px;padding:11px 13px;border-radius:var(--rs);border:.5px solid var(--border2);background:var(--surface);color:var(--text);-webkit-appearance:none}
.field input:focus,.field select:focus{outline:2px solid var(--accent);border-color:transparent}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ── CARDS ── */
.card{background:var(--card);border-radius:var(--r);border:.5px solid var(--border);padding:14px}

/* ── BADGE ── */
.badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
.badge-red{background:var(--red-bg);color:var(--red)}
.badge-amber{background:var(--amber-bg);color:var(--amber)}
.badge-green{background:var(--green-bg);color:var(--green)}
.badge-blue{background:var(--blue-bg);color:var(--blue)}

/* ── TABS ── */
.tabs{display:flex;gap:0;border-bottom:.5px solid var(--border);background:var(--card);position:sticky;top:57px;z-index:15}
.tab{flex:1;font-family:var(--font);font-size:13px;font-weight:500;padding:10px 4px;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ══════════════════════════════
   PAGE: LOGIN
══════════════════════════════ */
#page-login{padding:0;background:var(--accent);align-items:stretch}
.login-hero{background:var(--accent);color:#fff;padding:48px 24px 32px;text-align:center}
.login-hero .logo{font-size:48px;margin-bottom:12px}
.login-hero h1{font-size:22px;font-weight:700;letter-spacing:-.3px}
.login-hero p{font-size:13px;opacity:.6;margin-top:4px}
.login-body{background:var(--bg);border-radius:24px 24px 0 0;flex:1;padding:28px 20px 40px}
.login-body h2{font-size:16px;font-weight:600;margin-bottom:20px}

/* ══════════════════════════════
   PAGE: SHELF SELECT
══════════════════════════════ */
#page-shelf{background:var(--bg)}
.shelf-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}
.shelf-card{background:var(--card);border-radius:var(--r);border:.5px solid var(--border);padding:16px 12px;text-align:center;cursor:pointer;transition:all .15s;position:relative}
.shelf-card:active{transform:scale(.96)}
.shelf-card.selected{border:2px solid var(--accent);background:var(--surface)}
.shelf-card .shelf-icon{font-size:36px;margin-bottom:8px}
.shelf-card .shelf-num{font-size:10px;color:var(--muted);font-weight:500}
.shelf-card .shelf-name{font-size:14px;font-weight:600;margin-top:2px}
.shelf-card .shelf-status{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--green-mid)}
.shelf-card .shelf-status.done{background:var(--green-mid)}
.shelf-card .shelf-status.pending{background:var(--hint)}

/* ══════════════════════════════
   PAGE: CHECK (บันทึก)
══════════════════════════════ */
#page-check{background:var(--bg)}
.search-bar{padding:10px 14px;background:var(--card);border-bottom:.5px solid var(--border);display:flex;gap:8px;align-items:center;position:sticky;top:57px;z-index:14}
.search-bar input{flex:1;font-family:var(--font);font-size:15px;padding:9px 13px;border-radius:var(--rs);border:.5px solid var(--border2);background:var(--surface);color:var(--text)}
.scan-btn{flex-shrink:0;width:42px;height:42px;border-radius:var(--rs);background:var(--accent);color:#fff;border:none;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.product-list{padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.product-item{background:var(--card);border-radius:var(--r);border:.5px solid var(--border);padding:13px 14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.product-item:active{background:var(--surface)}
.product-item.logged{border-color:#C0DD97;background:var(--green-bg)}
.product-item.expired-log{border-color:#F7C1C1;background:var(--red-bg)}
.product-item.warning-log{border-color:#FAC775;background:var(--amber-bg)}
.pi-icon{width:40px;height:40px;border-radius:10px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.pi-body{flex:1;min-width:0}
.pi-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi-sub{font-size:12px;color:var(--muted);margin-top:2px}
.pi-right{text-align:right;flex-shrink:0}
.pi-date{font-size:12px;font-weight:700}
.pi-days{font-size:11px;margin-top:2px}
.product-item.logged .pi-date{color:var(--green)}
.product-item.expired-log .pi-date{color:var(--red)}
.product-item.warning-log .pi-date{color:var(--amber)}

/* ══════════════════════════════
   PAGE: ADMIN
══════════════════════════════ */
#page-admin{background:var(--bg)}
.admin-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px 0}
.admin-stat{background:var(--card);border-radius:var(--rs);border:.5px solid var(--border);padding:12px;text-align:center}
.admin-stat .num{font-size:26px;font-weight:700}
.admin-stat .lbl{font-size:11px;color:var(--muted);margin-top:2px}
.admin-stat.red .num{color:var(--red)}
.admin-stat.green .num{color:var(--green-mid)}
.section-header{font-size:11px;font-weight:600;color:var(--hint);text-transform:uppercase;letter-spacing:.06em;padding:14px 14px 6px}
.shelf-row{background:var(--card);border-radius:var(--r);border:.5px solid var(--border);margin:0 14px 8px;padding:13px 14px;display:flex;align-items:center;gap:12px}
.shelf-row-icon{font-size:24px;flex-shrink:0}
.shelf-row-body{flex:1}
.shelf-row-name{font-size:14px;font-weight:600}
.shelf-row-sub{font-size:12px;color:var(--muted);margin-top:2px}
.history-item{background:var(--card);border-radius:var(--r);border:.5px solid var(--border);margin:0 14px 8px;padding:13px 14px}
.history-meta{font-size:12px;color:var(--muted);margin-top:4px}
.log-entry{padding:8px 0;border-bottom:.5px solid var(--border);display:flex;align-items:center;gap:8px}
.log-entry:last-child{border-bottom:none}
.log-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.log-dot.red{background:var(--red-mid)}
.log-dot.amber{background:var(--amber-mid)}
.log-dot.green{background:var(--green-mid)}

/* ══════════════════════════════
   MODAL / SHEET
══════════════════════════════ */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:all}
.sheet{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:20px 20px 48px;transform:translateY(100%);transition:transform .25s ease;max-height:90vh;overflow-y:auto}
.overlay.show .sheet{transform:translateY(0)}
.sheet-handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 18px}
.sheet h3{font-size:17px;font-weight:600;margin-bottom:16px}

/* ══════════════════════════════
   SCANNER
══════════════════════════════ */
#scanner-overlay{position:fixed;inset:0;z-index:60;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center}
#scanner-overlay.show{display:flex}
#scanner-video{width:100%;max-width:400px;border-radius:12px}
.scanner-frame{position:relative;width:260px;height:260px;margin:20px auto}
.scanner-frame::before,.scanner-frame::after{content:'';position:absolute;width:40px;height:40px;border-color:#fff;border-style:solid}
.scanner-frame::before{top:0;left:0;border-width:3px 0 0 3px;border-radius:4px 0 0 0}
.scanner-frame::after{bottom:0;right:0;border-width:0 3px 3px 0;border-radius:0 0 4px 0}
.scanner-line{position:absolute;left:10px;right:10px;top:50%;height:2px;background:rgba(255,100,100,.8);animation:scan 2s linear infinite}
@keyframes scan{0%{top:15%}50%{top:85%}100%{top:15%}}
.scanner-tip{color:#fff;font-size:14px;text-align:center;margin-top:16px;opacity:.8}
.btn-cancel-scan{margin-top:24px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);font-family:var(--font);font-size:15px;padding:12px 32px;border-radius:var(--rs);cursor:pointer}

/* ── MISC ── */
.empty{text-align:center;padding:48px 20px;color:var(--hint)}
.empty-icon{font-size:48px;display:block;margin-bottom:10px}
.fab{position:fixed;bottom:24px;right:18px;z-index:30;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.22)}
.month-badge{display:inline-block;background:var(--surface2);border-radius:8px;padding:4px 12px;font-size:13px;font-weight:600;color:var(--muted);margin:8px 14px 0}
.divider{height:.5px;background:var(--border);margin:8px 14px}
</style>
</head>
<body>

<!-- ════════════ PAGE: LOGIN ════════════ -->
<div id="page-login" class="page active">
  <div class="login-hero">
    <div class="logo">🏪</div>
    <h1>ระบบเช็ควันหมดอายุ</h1>
    <p>กรอกชื่อเพื่อเริ่มงาน</p>
  </div>
  <div class="login-body">
    <h2>ยินดีต้อนรับ</h2>
    <div class="field">
      <label>ชื่อพนักงาน</label>
      <input type="text" id="login-name" placeholder="กรอกชื่อของคุณ..." />
    </div>
    <button class="btn btn-primary" onclick="doLogin()" style="margin-top:8px">เริ่มงาน →</button>
    <div style="margin-top:20px;text-align:center">
      <button class="btn-text" onclick="goAdmin()">🔧 เข้าหน้าผู้จัดการ</button>
    </div>
  </div>
</div>

<!-- ════════════ PAGE: SHELF SELECT ════════════ -->
<div id="page-shelf" class="page">
  <div class="topbar">
    <button class="btn-back" onclick="showPage('page-login')">←</button>
    <div>
      <h2>เลือกชั้นที่รับผิดชอบ</h2>
      <div class="topbar-sub" id="shelf-user-label"></div>
    </div>
  </div>
  <div style="padding:12px 14px 4px">
    <div class="month-badge" id="shelf-month-label"></div>
    <p style="font-size:13px;color:var(--muted);padding:8px 14px 0">เลือกชั้นที่คุณได้รับมอบหมายเดือนนี้</p>
  </div>
  <div class="shelf-grid" id="shelf-grid"></div>
  <div style="padding:0 14px 20px">
    <button class="btn btn-primary" id="btn-start-check" onclick="startCheck()" disabled>เริ่มเช็คสินค้า →</button>
  </div>
</div>

<!-- ════════════ PAGE: CHECK ════════════ -->
<div id="page-check" class="page">
  <div class="topbar">
    <button class="btn-back" onclick="showPage('page-shelf')">←</button>
    <div>
      <h2 id="check-title">เช็คสินค้า</h2>
      <div class="topbar-sub" id="check-sub"></div>
    </div>
    <button class="btn-text" onclick="finishCheck()">เสร็จแล้ว ✓</button>
  </div>
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="🔍 ค้นหาสินค้า..." oninput="renderProducts()" />
    <button class="scan-btn" onclick="openScanner()" title="สแกนบาร์โค้ด">⬛</button>
  </div>
  <div class="product-list" id="product-list"></div>
</div>

<!-- ════════════ PAGE: ADMIN ════════════ -->
<div id="page-admin" class="page">
  <div class="topbar">
    <button class="btn-back" onclick="showPage('page-login')">←</button>
    <h2>หน้าผู้จัดการ</h2>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchAdminTab('overview',this)">ภาพรวม</button>
    <button class="tab" onclick="switchAdminTab('products',this)">จัดการสินค้า</button>
    <button class="tab" onclick="switchAdminTab('history',this)">ประวัติ</button>
    <button class="tab" onclick="switchAdminTab('export',this)">ส่งออก</button>
  </div>
  <div id="admin-overview" class="admin-tab"></div>
  <div id="admin-products" class="admin-tab" style="display:none"></div>
  <div id="admin-history" class="admin-tab" style="display:none"></div>
  <div id="admin-export" class="admin-tab" style="display:none"></div>
  <button class="fab" id="admin-fab" onclick="openAddProduct()" title="เพิ่มสินค้า">＋</button>
</div>

<!-- ════════════ MODAL: บันทึกวันหมดอายุ ════════════ -->
<div class="overlay" id="modal-log" onclick="closeIfBg(event,'modal-log')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3 id="log-product-name">บันทึกวันหมดอายุ</h3>
    <p style="font-size:13px;color:var(--muted);margin-bottom:16px" id="log-product-barcode"></p>
    <div class="field">
      <label>วันหมดอายุ *</label>
      <input type="date" id="log-date" />
    </div>
    <div class="field">
      <label>หมายเหตุ (ถ้ามี)</label>
      <input type="text" id="log-note" placeholder="เช่น เปิดแล้ว, ชำรุด..." />
    </div>
    <button class="btn btn-primary" onclick="saveLog()">✓ บันทึก</button>
    <button class="btn btn-outline" style="margin-top:8px" onclick="closeModal('modal-log')">ยกเลิก</button>
  </div>
</div>

<!-- ════════════ MODAL: เพิ่มสินค้า (Admin) ════════════ -->
<div class="overlay" id="modal-product" onclick="closeIfBg(event,'modal-product')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3 id="modal-product-title">เพิ่มสินค้า</h3>
    <div class="field">
      <label>ชื่อสินค้า *</label>
      <input type="text" id="prod-name" placeholder="ชื่อสินค้า..." />
    </div>
    <div class="field-row">
      <div class="field">
        <label>บาร์โค้ด</label>
        <input type="text" id="prod-barcode" placeholder="ไม่บังคับ" />
      </div>
      <div class="field">
        <label>ชั้นที่วาง</label>
        <select id="prod-shelf"></select>
      </div>
    </div>
    <div class="field">
      <label>หมวดหมู่</label>
      <select id="prod-cat">
        <option>🧁 เบเกอรี่</option>
        <option>🥛 นม/ครีม</option>
        <option>🧴 สารเสริม</option>
        <option>🧈 แป้ง/เนย</option>
        <option>🍖 หมูหยอง/ฟิลลิ่ง</option>
        <option>❄️ แช่แข็ง</option>
        <option>📦 อื่นๆ</option>
      </select>
    </div>
    <input type="hidden" id="prod-edit-id" />
    <button class="btn btn-primary" onclick="saveProduct()">✓ บันทึกสินค้า</button>
    <button class="btn btn-outline" style="margin-top:8px" onclick="closeModal('modal-product')">ยกเลิก</button>
  </div>
</div>

<!-- ════════════ SCANNER ════════════ -->
<div id="scanner-overlay">
  <div style="color:#fff;font-size:18px;font-weight:600;margin-bottom:8px">สแกนบาร์โค้ด</div>
  <div class="scanner-frame">
    <video id="scanner-video" autoplay playsinline muted></video>
    <div class="scanner-line"></div>
  </div>
  <p class="scanner-tip">จ่อบาร์โค้ดให้ตรงกรอบ</p>
  <button class="btn-cancel-scan" onclick="closeScanner()">✕ ยกเลิก</button>
</div>

<script>
// ══════════════════════════════════════
// DATA STORE
// ══════════════════════════════════════
const SHELVES = [
  {id:2, name:'หมูหยอง', icon:'🍖'},
  {id:3, name:'ฟิลลิ่ง', icon:'🍯'},
  {id:5, name:'แป้งมัน', icon:'🌾'},
  {id:6, name:'ตู้เย็น', icon:'❄️'},
  {id:7, name:'สารเสริม', icon:'🧴'},
  {id:8, name:'ชั้นติ่งฟง', icon:'🧁'},
  {id:9, name:'แป้ง/เนย', icon:'🧈'},
];

function load(k,def){try{return JSON.parse(localStorage.getItem(k))||def}catch{return def}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}

let products = load('products_v2',[]);
let logs = load('logs_v2',[]);
let currentUser = null;
let currentShelf = null;
let selectedProductId = null;
let scannerStream = null;
let scanInterval = null;

// ══════════════════════════════════════
// HELPERS
// ══════════════════════════════════════
function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function daysDiff(ds){const t=today();const e=new Date(ds);e.setHours(0,0,0,0);return Math.round((e-t)/86400000)}
function getStatus(d){if(d<0)return'red';if(d<=7)return'amber';return'green'}
function monthKey(){const n=new Date();return`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`}
function monthLabel(){return new Date().toLocaleDateString('th-TH',{year:'numeric',month:'long'})}
function shelfById(id){return SHELVES.find(s=>s.id===id)||{name:'?',icon:'📦'}}
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// ══════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
  if(id==='page-admin')renderAdmin();
}
function closeIfBg(e,id){if(e.target.id===id)closeModal(id)}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function openModal(id){document.getElementById(id).classList.add('show')}

// ══════════════════════════════════════
// LOGIN
// ══════════════════════════════════════
function doLogin(){
  const name=document.getElementById('login-name').value.trim();
  if(!name){alert('กรุณากรอกชื่อ');return}
  currentUser=name;
  currentShelf=null;
  document.getElementById('shelf-user-label').textContent='สวัสดี '+name;
  document.getElementById('shelf-month-label').textContent='เดือน: '+monthLabel();
  renderShelfGrid();
  showPage('page-shelf');
}
function goAdmin(){showPage('page-admin')}

// ══════════════════════════════════════
// SHELF SELECTION
// ══════════════════════════════════════
function renderShelfGrid(){
  const mk=monthKey();
  const grid=document.getElementById('shelf-grid');
  grid.innerHTML=SHELVES.map(s=>{
    const done=logs.some(l=>l.shelfId===s.id&&l.monthKey===mk);
    return`<div class="shelf-card${currentShelf===s.id?' selected':''}" onclick="selectShelf(${s.id})">
      <div class="shelf-icon">${s.icon}</div>
      <div class="shelf-num">ชั้น ${s.id}</div>
      <div class="shelf-name">${s.name}</div>
      <div class="shelf-status ${done?'done':'pending'}"></div>
    </div>`;
  }).join('');
  document.getElementById('btn-start-check').disabled=!currentShelf;
}
function selectShelf(id){
  currentShelf=id;
  renderShelfGrid();
  document.getElementById('btn-start-check').disabled=false;
}
function startCheck(){
  if(!currentShelf)return;
  const sh=shelfById(currentShelf);
  document.getElementById('check-title').textContent=`ชั้น ${currentShelf} · ${sh.name}`;
  document.getElementById('check-sub').textContent=`${currentUser} · ${monthLabel()}`;
  document.getElementById('search-input').value='';
  renderProducts();
  showPage('page-check');
}

// ══════════════════════════════════════
// PRODUCT LIST & LOG
// ══════════════════════════════════════
function getLogForProduct(productId){
  const mk=monthKey();
  return logs.find(l=>l.productId===productId&&l.shelfId===currentShelf&&l.monthKey===mk);
}
function renderProducts(){
  const q=document.getElementById('search-input').value.trim().toLowerCase();
  const shelfProds=products.filter(p=>p.shelfId===currentShelf);
  const filtered=q?shelfProds.filter(p=>p.name.toLowerCase().includes(q)||(p.barcode&&p.barcode.includes(q))):shelfProds;
  const el=document.getElementById('product-list');
  if(filtered.length===0){
    el.innerHTML=`<div class="empty"><span class="empty-icon">📦</span><p>${q?'ไม่พบสินค้าที่ค้นหา':'ยังไม่มีสินค้าในชั้นนี้'}</p><p style="font-size:12px;margin-top:4px">ผู้จัดการสามารถเพิ่มสินค้าได้ที่หน้า Admin</p></div>`;
    return;
  }
  el.innerHTML=filtered.map(p=>{
    const log=getLogForProduct(p.id);
    let cls='',rightHtml='<span style="font-size:22px;color:var(--hint)">›</span>';
    if(log){
      const d=daysDiff(log.expDate);
      const st=getStatus(d);
      cls=st==='red'?'expired-log':st==='amber'?'warning-log':'logged';
      const dLabel=d<0?`เกิน ${Math.abs(d)} วัน`:d===0?'หมดวันนี้':d===1?'พรุ่งนี้':`อีก ${d} วัน`;
      const expStr=new Date(log.expDate).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'});
      rightHtml=`<div class="pi-date">${expStr}</div><div class="pi-days" style="color:${st==='red'?'var(--red)':st==='amber'?'var(--amber)':'var(--green)'}">${dLabel}</div>`;
    }
    return`<div class="product-item ${cls}" onclick="openLogModal(${p.id})">
      <div class="pi-icon">${p.cat?p.cat.split(' ')[0]:'📦'}</div>
      <div class="pi-body">
        <div class="pi-name">${escH(p.name)}</div>
        <div class="pi-sub">${p.barcode?'#'+p.barcode:'ไม่มีบาร์โค้ด'} ${log?'· บันทึกแล้ว ✓':''}</div>
      </div>
      <div class="pi-right">${rightHtml}</div>
    </div>`;
  }).join('');
}
function openLogModal(productId){
  const p=products.find(x=>x.id===productId);
  if(!p)return;
  selectedProductId=productId;
  document.getElementById('log-product-name').textContent=p.name;
  document.getElementById('log-product-barcode').textContent=p.barcode?'บาร์โค้ด: '+p.barcode:'';
  const existing=getLogForProduct(productId);
  const inp=document.getElementById('log-date');
  inp.value=existing?existing.expDate:'';
  document.getElementById('log-note').value=existing?existing.note||'':'';
  if(!inp.value){const d=new Date();d.setMonth(d.getMonth()+1);inp.value=d.toISOString().slice(0,10)}
  openModal('modal-log');
}
function saveLog(){
  const date=document.getElementById('log-date').value;
  const note=document.getElementById('log-note').value.trim();
  if(!date){alert('กรุณาเลือกวันหมดอายุ');return}
  const mk=monthKey();
  logs=logs.filter(l=>!(l.productId===selectedProductId&&l.shelfId===currentShelf&&l.monthKey===mk));
  logs.push({id:Date.now(),productId:selectedProductId,shelfId:currentShelf,expDate:date,note,user:currentUser,monthKey:mk,loggedAt:new Date().toISOString()});
  save('logs_v2',logs);
  closeModal('modal-log');
  renderProducts();
}
function finishCheck(){
  const shelfProds=products.filter(p=>p.shelfId===currentShelf);
  const mk=monthKey();
  const done=shelfProds.filter(p=>logs.some(l=>l.productId===p.id&&l.shelfId===currentShelf&&l.monthKey===mk));
  if(shelfProds.length>0&&done.length<shelfProds.length){
    if(!confirm(`ยังเช็คไม่ครบ (${done.length}/${shelfProds.length} รายการ) ต้องการออกไหม?`))return;
  }
  showPage('page-shelf');
}

// ══════════════════════════════════════
// SCANNER
// ══════════════════════════════════════
function openScanner(){
  if(!('BarcodeDetector'in window)){
    const q=prompt('ป้อนบาร์โค้ดด้วยตนเอง:');
    if(q)searchByBarcode(q.trim());
    return;
  }
  document.getElementById('scanner-overlay').classList.add('show');
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(stream=>{
    scannerStream=stream;
    const v=document.getElementById('scanner-video');
    v.srcObject=stream;
    const bd=new BarcodeDetector({formats:['ean_13','ean_8','code_128','code_39','qr_code']});
    scanInterval=setInterval(()=>{
      if(v.readyState===v.HAVE_ENOUGH_DATA){
        bd.detect(v).then(r=>{if(r.length>0){searchByBarcode(r[0].rawValue);closeScanner()}}).catch(()=>{});
      }
    },500);
  }).catch(()=>{alert('ไม่สามารถเข้าถึงกล้องได้');closeScanner()});
}
function closeScanner(){
  document.getElementById('scanner-overlay').classList.remove('show');
  if(scannerStream)scannerStream.getTracks().forEach(t=>t.stop());
  if(scanInterval)clearInterval(scanInterval);
  scannerStream=null;scanInterval=null;
}
function searchByBarcode(code){
  document.getElementById('search-input').value=code;
  renderProducts();
  const match=products.find(p=>p.barcode===code&&p.shelfId===currentShelf);
  if(match)openLogModal(match.id);
  else alert(`ไม่พบสินค้าบาร์โค้ด: ${code}\nในชั้นนี้`);
}

// ══════════════════════════════════════
// ADMIN
// ══════════════════════════════════════
let adminTab='overview';
function switchAdminTab(tab,el){
  adminTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.admin-tab').forEach(t=>t.style.display='none');
  document.getElementById('admin-'+tab).style.display='block';
  document.getElementById('admin-fab').style.display=tab==='products'?'flex':'none';
  renderAdminTab(tab);
}
function renderAdmin(){
  renderAdminTab(adminTab);
  document.getElementById('admin-fab').style.display=adminTab==='products'?'flex':'none';
}
function renderAdminTab(tab){
  if(tab==='overview')renderOverview();
  else if(tab==='products')renderAdminProducts();
  else if(tab==='history')renderHistory();
  else if(tab==='export')renderExport();
}
function renderOverview(){
  const mk=monthKey();
  const el=document.getElementById('admin-overview');
  const totalProds=products.length;
  const totalLogs=logs.filter(l=>l.monthKey===mk).length;
  const expiredLogs=logs.filter(l=>l.monthKey===mk&&daysDiff(l.expDate)<0).length;
  const warningLogs=logs.filter(l=>l.monthKey===mk&&daysDiff(l.expDate)>=0&&daysDiff(l.expDate)<=7).length;
  let shelfRows=SHELVES.map(s=>{
    const shelfLogs=logs.filter(l=>l.shelfId===s.id&&l.monthKey===mk);
    const shelfProds=products.filter(p=>p.shelfId===s.id);
    const users=[...new Set(shelfLogs.map(l=>l.user))];
    const pct=shelfProds.length?Math.round(shelfLogs.length/shelfProds.length*100):0;
    const done=shelfProds.length>0&&shelfLogs.length>=shelfProds.length;
    return`<div class="shelf-row">
      <div class="shelf-row-icon">${s.icon}</div>
      <div class="shelf-row-body">
        <div class="shelf-row-name">ชั้น ${s.id} · ${s.name}</div>
        <div class="shelf-row-sub">${users.length?'โดย '+users.join(', '):'ยังไม่มีการเช็ค'} · ${shelfLogs.length}/${shelfProds.length} รายการ</div>
      </div>
      <span class="badge ${done?'badge-green':'badge-blue'}">${done?'เสร็จ':''+pct+'%'}</span>
    </div>`;
  }).join('');
  el.innerHTML=`
    <div class="month-badge" style="margin:12px 14px 0">เดือน: ${monthLabel()}</div>
    <div class="admin-stats">
      <div class="admin-stat"><div class="num">${totalLogs}</div><div class="lbl">รายการที่เช็คแล้ว</div></div>
      <div class="admin-stat"><div class="num">${totalProds}</div><div class="lbl">สินค้าในระบบ</div></div>
      <div class="admin-stat red"><div class="num">${expiredLogs}</div><div class="lbl">หมดอายุแล้ว</div></div>
      <div class="admin-stat"><div class="num" style="color:var(--amber)">${warningLogs}</div><div class="lbl">ใกล้หมด ≤7 วัน</div></div>
    </div>
    <div class="section-header">สถานะแต่ละชั้น · เดือนนี้</div>
    ${shelfRows}`;
}
function renderAdminProducts(){
  const el=document.getElementById('admin-products');
  if(products.length===0){
    el.innerHTML=`<div class="empty"><span class="empty-icon">📦</span><p>ยังไม่มีสินค้า</p><p style="font-size:12px;margin-top:4px">กด + เพื่อเพิ่มสินค้า</p></div>`;
    return;
  }
  const byShelf=SHELVES.map(s=>{
    const ps=products.filter(p=>p.shelfId===s.id);
    if(!ps.length)return'';
    const rows=ps.map(p=>`<div class="product-item" style="cursor:default">
      <div class="pi-icon">${p.cat?p.cat.split(' ')[0]:'📦'}</div>
      <div class="pi-body"><div class="pi-name">${escH(p.name)}</div><div class="pi-sub">${p.barcode?'#'+p.barcode:'ไม่มีบาร์โค้ด'}</div></div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-sm btn-outline" onclick="editProduct(${p.id})">✏️</button>
        <button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.id})">🗑</button>
      </div>
    </div>`).join('');
    return`<div class="section-header">ชั้น ${s.id} · ${s.name} (${ps.length} รายการ)</div><div style="padding:0 14px;display:flex;flex-direction:column;gap:6px">${rows}</div>`;
  }).join('');
  el.innerHTML=byShelf||'<div class="empty">ไม่มีสินค้า</div>';
}
function renderHistory(){
  const el=document.getElementById('admin-history');
  const mk=monthKey();
  const monthLogs=logs.filter(l=>l.monthKey===mk).sort((a,b)=>new Date(b.loggedAt)-new Date(a.loggedAt));
  if(!monthLogs.length){el.innerHTML=`<div class="empty"><span class="empty-icon">📋</span><p>ยังไม่มีประวัติเดือนนี้</p></div>`;return}
  const byUser={};
  monthLogs.forEach(l=>{if(!byUser[l.user])byUser[l.user]=[];byUser[l.user].push(l)});
  let html='<div class="section-header">ประวัติการเช็ค · '+monthLabel()+'</div>';
  Object.entries(byUser).forEach(([user,ulogs])=>{
    const rows=ulogs.map(l=>{
      const p=products.find(x=>x.id===l.productId);
      const d=daysDiff(l.expDate);
      const st=getStatus(d);
      const expStr=new Date(l.expDate).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'});
      const logDate=new Date(l.loggedAt).toLocaleDateString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
      return`<div class="log-entry">
        <div class="log-dot ${st}"></div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p?escH(p.name):'(ลบแล้ว)'}</div>
          <div style="font-size:11px;color:var(--muted)">${shelfById(l.shelfId).icon} ชั้น ${l.shelfId} · ${logDate}</div>
        </div>
        <div style="text-align:right;flex-shrink:0"><div style="font-size:12px;font-weight:600;color:${st==='red'?'var(--red)':st==='amber'?'var(--amber)':'var(--green)'}">${expStr}</div></div>
      </div>`;
    }).join('');
    html+=`<div class="history-item" style="margin:0 14px 8px">
      <div style="font-size:14px;font-weight:600">👤 ${escH(user)} <span style="font-size:12px;font-weight:400;color:var(--muted)">(${ulogs.length} รายการ)</span></div>
      ${rows}
    </div>`;
  });
  el.innerHTML=html;
}
function renderExport(){
  const el=document.getElementById('admin-export');
  el.innerHTML=`<div style="padding:20px 14px;display:flex;flex-direction:column;gap:12px">
    <div class="card">
      <div style="font-size:15px;font-weight:600;margin-bottom:6px">📊 ส่งออก Excel</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:12px">ส่งออกรายการเช็ควันหมดอายุเดือนนี้</div>
      <button class="btn btn-primary" onclick="exportExcel()">⬇️ ดาวน์โหลด Excel</button>

    <div class="card">
      <div style="font-size:15px;font-weight:600;margin-bottom:6px">🖨️ ส่งออก PDF (พิมพ์)</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:12px">เปิดหน้าต่างพิมพ์เพื่อบันทึกเป็น PDF</div>
      <button class="btn btn-outline" onclick="exportPrint()">🖨️ พิมพ์ / บันทึก PDF</button>

// ══════════════════════════════════════
// PRODUCT CRUD
// ══════════════════════════════════════
function populateShelfSelect(selectedId){
  const sel=document.getElementById('prod-shelf');
  sel.innerHTML=SHELVES.map(s=>`<option value="${s.id}"${s.id===selectedId?' selected':''}>${s.icon} ชั้น ${s.id} · ${s.name}</option>`).join('');
}
function openAddProduct(){
  document.getElementById('modal-product-title').textContent='เพิ่มสินค้า';
  document.getElementById('prod-name').value='';
  document.getElementById('prod-barcode').value='';
  document.getElementById('prod-edit-id').value='';
  populateShelfSelect(SHELVES[0].id);
  openModal('modal-product');
}
function editProduct(id){
  const p=products.find(x=>x.id===id);if(!p)return;
  document.getElementById('modal-product-title').textContent='แก้ไขสินค้า';
  document.getElementById('prod-name').value=p.name;
  document.getElementById('prod-barcode').value=p.barcode||'';
  document.getElementById('prod-edit-id').value=p.id;
  populateShelfSelect(p.shelfId);
  const catSel=document.getElementById('prod-cat');
  for(let i=0;i<catSel.options.length;i++){if(catSel.options[i].value===p.cat)catSel.selectedIndex=i}
  openModal('modal-product');
}
function saveProduct(){
  const name=document.getElementById('prod-name').value.trim();
  const barcode=document.getElementById('prod-barcode').value.trim();
  const shelfId=parseInt(document.getElementById('prod-shelf').value);
  const cat=document.getElementById('prod-cat').value;
  const editId=document.getElementById('prod-edit-id').value;
  if(!name){alert('กรุณากรอกชื่อสินค้า');return}
  if(editId){
    products=products.map(p=>p.id===parseInt(editId)?{...p,name,barcode,shelfId,cat}:p);
  } else {
    products.push({id:Date.now(),name,barcode,shelfId,cat});
  }
  save('products_v2',products);
  closeModal('modal-product');
  renderAdminProducts();
}
function deleteProduct(id){
  if(!confirm('ลบสินค้านี้?'))return;
  products=products.filter(p=>p.id!==id);
  save('products_v2',products);
  renderAdminProducts();
}

// ══════════════════════════════════════
// EXPORT
// ══════════════════════════════════════
function exportExcel(){
  const mk=monthKey();
  const rows=[['วันที่บันทึก','พนักงาน','ชั้น','ชื่อสินค้า','บาร์โค้ด','วันหมดอายุ','สถานะ','หมายเหตุ']];
  const monthLogs=logs.filter(l=>l.monthKey===mk).sort((a,b)=>new Date(a.loggedAt)-new Date(b.loggedAt));
  monthLogs.forEach(l=>{
    const p=products.find(x=>x.id===l.productId);
    const sh=shelfById(l.shelfId);
    const d=daysDiff(l.expDate);
    const st=d<0?'หมดอายุแล้ว':d<=7?'ใกล้หมด':'ปลอดภัย';
    rows.push([
      new Date(l.loggedAt).toLocaleDateString('th-TH'),
      l.user,
      `ชั้น ${l.shelfId} ${sh.name}`,
      p?p.name:'(ลบแล้ว)',
      p?p.barcode||'':'',
      new Date(l.expDate).toLocaleDateString('th-TH'),
      st,
      l.note||''
    ]);
  });
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:16},{wch:14},{wch:16},{wch:24},{wch:14},{wch:14},{wch:12},{wch:20}];
  XLSX.utils.book_append_sheet(wb,ws,'เช็ควันหมดอายุ');
  XLSX.writeFile(wb,`expiry_${mk}.xlsx`);
}
function exportPrint(){
  const mk=monthKey();
  const monthLogs=logs.filter(l=>l.monthKey===mk).sort((a,b)=>new Date(a.loggedAt)-new Date(b.loggedAt));
  const rows=monthLogs.map(l=>{
    const p=products.find(x=>x.id===l.productId);
    const sh=shelfById(l.shelfId);
    const d=daysDiff(l.expDate);
    const st=d<0?'🔴 หมดอายุ':d<=7?'🟡 ใกล้หมด':'🟢 ปลอดภัย';
    return`<tr><td>${new Date(l.loggedAt).toLocaleDateString('th-TH')}</td><td>${l.user}</td><td>ชั้น ${l.shelfId} ${sh.name}</td><td>${p?p.name:'?'}</td><td>${new Date(l.expDate).toLocaleDateString('th-TH')}</td><td>${st}</td><td>${l.note||'-'}</td></tr>`;
  }).join('');
  const w=window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>รายงานวันหมดอายุ</title><style>body{font-family:sans-serif;font-size:12px;padding:20px}h2{font-size:16px;margin-bottom:8px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:6px 8px;text-align:left}th{background:#f0f0f0;font-weight:600}tr:nth-child(even){background:#fafafa}@media print{body{padding:0}}</style></head><body><h2>รายงานเช็ควันหมดอายุ · ${monthLabel()}</h2><p style="margin-bottom:12px;color:#666;font-size:11px">พิมพ์วันที่ ${new Date().toLocaleDateString('th-TH')}</p><table><thead><tr><th>วันที่เช็ค</th><th>พนักงาน</th><th>ชั้น</th><th>สินค้า</th><th>วันหมดอายุ</th><th>สถานะ</th><th>หมายเหตุ</th></tr></thead><tbody>${rows||'<tr><td colspan="7" style="text-align:center">ไม่มีข้อมูล</td></tr>'}</tbody></table></body></html>`);
  w.document.close();
  w.print();
}

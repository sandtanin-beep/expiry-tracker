<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="วันหมดอายุ">
<meta name="theme-color" content="#ffffff">
<title>บันทึกวันหมดอายุสินค้า</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --green: #3B6D11; --green-bg: #EAF3DE; --green-mid: #639922;
    --amber: #854F0B; --amber-bg: #FAEEDA; --amber-mid: #EF9F27;
    --red: #A32D2D; --red-bg: #FCEBEB; --red-mid: #E24B4A;
    --blue: #185FA5; --blue-bg: #E6F1FB;
    --text: #1a1a1a; --text-muted: #666; --text-hint: #999;
    --border: rgba(0,0,0,0.1); --border-mid: rgba(0,0,0,0.18);
    --bg: #f5f5f0; --card: #ffffff; --surface: #f0efe9;
    --radius: 14px; --radius-sm: 9px;
    --font: 'Sarabun', sans-serif;
  }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 90px;
  }
  /* TOPBAR */
  .topbar {
    background: var(--card);
    border-bottom: 0.5px solid var(--border);
    padding: 14px 16px 12px;
    position: sticky; top: 0; z-index: 20;
  }
  .topbar-row { display: flex; align-items: center; justify-content: space-between; }
  .topbar h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
  .topbar-date { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .btn-icon {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--surface); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  /* STATS */
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 12px 14px 0; }
  .stat {
    background: var(--card); border-radius: var(--radius-sm);
    border: 0.5px solid var(--border); padding: 10px 8px; text-align: center;
  }
  .stat-num { font-size: 24px; font-weight: 700; line-height: 1; }
  .stat-lbl { font-size: 10px; color: var(--text-muted); margin-top: 3px; line-height: 1.3; }
  .stat.red .stat-num { color: var(--red); }
  .stat.amber .stat-num { color: var(--amber); }
  .stat.green .stat-num { color: var(--green-mid); }
  /* FILTER */
  .filters { display: flex; gap: 6px; padding: 10px 14px; overflow-x: auto; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; font-family: var(--font); font-size: 13px;
    padding: 5px 14px; border-radius: 20px;
    border: 0.5px solid var(--border-mid);
    background: var(--card); color: var(--text-muted);
    cursor: pointer; white-space: nowrap;
  }
  .chip.active { background: var(--text); color: #fff; border-color: var(--text); font-weight: 500; }
  /* LIST */
  .list { padding: 0 14px; display: flex; flex-direction: column; gap: 8px; }
  .item {
    background: var(--card); border-radius: var(--radius);
    border: 0.5px solid var(--border); padding: 13px 14px;
    display: flex; align-items: center; gap: 12px;
    transition: transform 0.1s;
  }
  .item:active { transform: scale(0.98); }
  .item.red { border-color: #F7C1C1; background: #FCEBEB; }
  .item.amber { border-color: #FAC775; background: #FAEEDA; }
  .item.green { border-color: #C0DD97; background: #EAF3DE; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .item.red .dot { background: var(--red-mid); }
  .item.amber .dot { background: var(--amber-mid); }
  .item.green .dot { background: var(--green-mid); }
  .item-body { flex: 1; min-width: 0; }
  .item-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .item-days { font-size: 12px; font-weight: 700; flex-shrink: 0; text-align: right; line-height: 1.3; }
  .item.red .item-days { color: var(--red); }
  .item.amber .item-days { color: var(--amber); }
  .item.green .item-days { color: var(--green); }
  .btn-del {
    background: none; border: none; color: var(--text-hint);
    font-size: 20px; cursor: pointer; padding: 4px; line-height: 1;
    flex-shrink: 0;
  }
  /* EMPTY */
  .empty { text-align: center; padding: 48px 24px; color: var(--text-hint); }
  .empty-icon { font-size: 48px; display: block; margin-bottom: 12px; }
  .empty p { font-size: 14px; }
  /* FAB */
  .fab {
    position: fixed; bottom: 24px; right: 20px; z-index: 30;
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--text); color: #fff; border: none;
    font-size: 28px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  }
  /* MODAL */
  .overlay {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(0,0,0,0.45);
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .overlay.show { opacity: 1; pointer-events: all; }
  .sheet {
    background: var(--card); border-radius: 20px 20px 0 0;
    width: 100%; max-width: 480px; padding: 20px 20px 40px;
    transform: translateY(100%); transition: transform 0.25s ease;
  }
  .overlay.show .sheet { transform: translateY(0); }
  .sheet-handle { width: 40px; height: 4px; background: var(--border-mid); border-radius: 2px; margin: 0 auto 20px; }
  .sheet h2 { font-size: 17px; font-weight: 600; margin-bottom: 16px; }
  .field { margin-bottom: 14px; }
  .field label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 5px; font-weight: 500; }
  .field input, .field select {
    width: 100%; font-family: var(--font); font-size: 16px;
    padding: 11px 13px; border-radius: var(--radius-sm);
    border: 0.5px solid var(--border-mid);
    background: var(--surface); color: var(--text);
    appearance: none; -webkit-appearance: none;
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--text); border-color: transparent; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn-save {
    width: 100%; padding: 14px; font-family: var(--font);
    font-size: 16px; font-weight: 600; border-radius: var(--radius-sm);
    background: var(--text); color: #fff; border: none; cursor: pointer;
    margin-top: 4px;
  }
  .btn-save:active { opacity: 0.8; }
  /* section label */
  .sec-label {
    font-size: 11px; font-weight: 600; color: var(--text-hint);
    text-transform: uppercase; letter-spacing: 0.06em;
    padding: 10px 14px 6px;
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <h1>📦 วันหมดอายุสินค้า</h1>
  </div>
  <div class="topbar-date" id="today-lbl"></div>
</div>

<div class="stats" id="stats-row">
  <div class="stat red"><div class="stat-num" id="s-exp">0</div><div class="stat-lbl">หมดอายุแล้ว</div></div>
  <div class="stat amber"><div class="stat-num" id="s-warn">0</div><div class="stat-lbl">ใกล้หมด<br>≤ 7 วัน</div></div>
  <div class="stat green"><div class="stat-num" id="s-ok">0</div><div class="stat-lbl">ยังปลอดภัย</div></div>
</div>

<div class="filters">
  <div class="chip active" onclick="setFilter('all',this)">ทั้งหมด</div>
  <div class="chip" onclick="setFilter('red',this)">🔴 หมดอายุ</div>
  <div class="chip" onclick="setFilter('amber',this)">🟡 ใกล้หมด</div>
  <div class="chip" onclick="setFilter('green',this)">🟢 ปลอดภัย</div>
</div>

<div class="sec-label" id="list-label">รายการสินค้า</div>
<div class="list" id="item-list"></div>

<button class="fab" onclick="openModal()" aria-label="เพิ่มสินค้า">＋</button>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="closeIfBg(event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>เพิ่มสินค้า</h2>
    <div class="field">
      <label>ชื่อสินค้า *</label>
      <input type="text" id="inp-name" placeholder="เช่น นมสด UHT, ยาพาราเซตามอล..." />
    </div>
    <div class="field-row">
      <div class="field">
        <label>หมวดหมู่</label>
        <select id="inp-cat">
          <option>🥗 อาหาร</option>
          <option>🥤 เครื่องดื่ม</option>
          <option>💊 ยา</option>
          <option>🧴 ของใช้</option>
          <option>📦 อื่นๆ</option>
        </select>
      </div>
      <div class="field">
        <label>วันหมดอายุ *</label>
        <input type="date" id="inp-date" />
      </div>
    </div>
    <button class="btn-save" onclick="addItem()">✓ บันทึก</button>
  </div>
</div>

<script>
const KEY = 'expiry_v2';
let items = JSON.parse(localStorage.getItem(KEY) || '[]');
let filter = 'all';

function today() {
  const d = new Date(); d.setHours(0,0,0,0); return d;
}
function daysDiff(ds) {
  const t = today();
  const e = new Date(ds); e.setHours(0,0,0,0);
  return Math.round((e - t) / 86400000);
}
function getStatus(d) {
  if (d < 0) return 'red';
  if (d <= 7) return 'amber';
  return 'green';
}
function save() { localStorage.setItem(KEY, JSON.stringify(items)); }

function openModal() {
  document.getElementById('overlay').classList.add('show');
  document.getElementById('inp-name').focus();
}
function closeModal() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('inp-name').value = '';
}
function closeIfBg(e) {
  if (e.target === document.getElementById('overlay')) closeModal();
}

function setFilter(f, el) {
  filter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  render();
}

function addItem() {
  const name = document.getElementById('inp-name').value.trim();
  const cat = document.getElementById('inp-cat').value;
  const date = document.getElementById('inp-date').value;
  if (!name) { alert('กรุณากรอกชื่อสินค้า'); return; }
  if (!date) { alert('กรุณาเลือกวันหมดอายุ'); return; }
  items.push({ id: Date.now(), name, cat, date });
  items.sort((a,b) => a.date.localeCompare(b.date));
  save(); render(); closeModal();
}

function deleteItem(id) {
  if (!confirm('ลบสินค้านี้?')) return;
  items = items.filter(i => i.id !== id);
  save(); render();
}

function render() {
  // today label
  const td = new Date();
  document.getElementById('today-lbl').textContent =
    'วันนี้ ' + td.toLocaleDateString('th-TH', {weekday:'long', year:'numeric', month:'long', day:'numeric'});

  // stats
  let exp=0, warn=0, ok=0;
  items.forEach(i => {
    const s = getStatus(daysDiff(i.date));
    if (s==='red') exp++; else if (s==='amber') warn++; else ok++;
  });
  document.getElementById('s-exp').textContent = exp;
  document.getElementById('s-warn').textContent = warn;
  document.getElementById('s-ok').textContent = ok;

  // list
  const visible = filter === 'all' ? items : items.filter(i => getStatus(daysDiff(i.date)) === filter);
  document.getElementById('list-label').textContent =
    `รายการสินค้า (${visible.length} รายการ)`;

  const el = document.getElementById('item-list');
  if (visible.length === 0) {
    el.innerHTML = `<div class="empty"><span class="empty-icon">📋</span><p>ยังไม่มีสินค้าในหมวดนี้</p></div>`;
    return;
  }

  el.innerHTML = visible.map(i => {
    const d = daysDiff(i.date);
    const s = getStatus(d);
    let dayTxt;
    if (d < 0) dayTxt = `เกิน<br>${Math.abs(d)} วัน`;
    else if (d === 0) dayTxt = 'หมดวันนี้!';
    else if (d === 1) dayTxt = 'พรุ่งนี้!';
    else dayTxt = `อีก<br>${d} วัน`;
    const expDate = new Date(i.date).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'});
    return `<div class="item ${s}">
      <div class="dot"></div>
      <div class="item-body">
        <div class="item-name">${escHtml(i.name)}</div>
        <div class="item-sub">${i.cat} · หมด ${expDate}</div>
      </div>
      <div class="item-days">${dayTxt}</div>
      <button class="btn-del" onclick="deleteItem(${i.id})" aria-label="ลบ">×</button>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// default date = 7 days from now
const def = new Date(); def.setDate(def.getDate()+7);
document.getElementById('inp-date').value = def.toISOString().slice(0,10);

render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="เช็คสินค้า">
<meta name="theme-color" content="#1a1a1a">
<title>ระบบเช็ควันหมดอายุ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f4f3ef;--card:#fff;--surface:#f0efe9;--surface2:#e8e7e1;
  --text:#1a1a1a;--muted:#666;--hint:#aaa;
  --border:rgba(0,0,0,0.09);--border2:rgba(0,0,0,0.16);
  --green:#3B6D11;--green-bg:#EAF3DE;--green-mid:#639922;
  --amber:#854F0B;--amber-bg:#FAEEDA;--amber-mid:#EF9F27;
  --red:#A32D2D;--red-bg:#FCEBEB;--red-mid:#E24B4A;
  --blue:#185FA5;--blue-bg:#E6F1FB;
  --accent:#1a1a1a;
  --r:14px;--rs:9px;--font:'Sarabun',sans-serif
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.page{display:none;min-height:100vh;flex-direction:column}
.page.active{display:flex}

/* TOPBAR */
.topbar{background:var(--card);border-bottom:.5px solid var(--border);padding:14px 16px 12px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px}
.topbar h2{font-size:17px;font-weight:600;flex:1}
.topbar-sub{font-size:12px;color:var(--muted);margin-top:1px}
.btn-back{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text);padding:2px 6px 2px 0}
.btn-text{background:none;border:none;font-family:var(--font);font-size:14px;color:var(--blue);cursor:pointer;padding:4px 0}

/* BUTTONS */
.btn{display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--font);font-size:15px;font-weight:600;padding:13px;border-radius:var(--rs);border:none;cursor:pointer;transition:opacity .15s}
.btn:active{opacity:.75}
.btn-primary{background:var(--accent);color:#fff;width:100%}
.btn-outline{background:var(--card);color:var(--text);border:.5px solid var(--border2);width:100%}
.btn-sm{font-size:13px;padding:8px 14px;border-radius:8px}
.btn-danger{background:var(--red-bg);color:var(--red);border:.5px solid #F7C1C1}

/* FORM */
.field{margin-bottom:14px}
.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px;font-weight:500}
.field input,.field select,.field textarea{width:100%;font-family:var(--font);font-size:16px;padding:11px 13px;border-radius:var(--rs);border:.5px solid var(--border2);background:var(--surface);color:var(--text);-webkit-appearance:none}
.field input:focus,.field select:focus{outline:2px solid var(--accent);border-color:transparent}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* CARDS */
.card{background:var(--card);border-radius:var(--r);border:.5px solid var(--border);padding:14px}

/* BADGE */
.badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
.badge-red{background:var(--red-bg);color:var(--red)}
.badge-amber{background:var(--amber-bg);color:var(--amber)}
.badge-green{background:var(--green-bg);color:var(--green)}
.badge-blue{background:var(--blue-bg);color:var(--blue)}

/* TABS */
.tabs{display:flex;gap:0;border-bottom:.5px solid var(--border);background:var(--card);position:sticky;top:57px;z-index:15}
.tab{flex:1;font-family:var(--font);font-size:13px;font-weight:500;padding:10px 4px;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* LOGIN */
#page-login{padding:0;background:var(--accent);align-items:stretch}
.login-hero{background:var(--accent);color:#fff;padding:48px 24px 32px;text-align:center}
.login-hero .logo{font-size:48px;margin-bottom:12px}
.login-hero h1{font-size:22px;font-weight:700;letter-spacing:-.3px}
.login-hero p{font-size:13px;opacity:.6;margin-top:4px}
.login-body{background:var(--bg);border-radius:24px 24px 0 0;flex:1;padding:28px 20px 40px}
.login-body h2{font-size:16px;font-weight:600;margin-bottom:20px}

/* SHELF */
#page-shelf{background:var(--bg)}
.shelf-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}
.shelf-card{background:var(--card);border-radius:var(--r);border:.5px solid var(--border);padding:16px 12px;text-align:center;cursor:pointer;transition:all .15s;position:relative}
.shelf-card:active{transform:scale(.96)}
.shelf-card.selected{border:2px solid var(--accent);background:var(--surface)}
.shelf-card .shelf-icon{font-size:36px;margin-bottom:8px}
.shelf-card .shelf-num{font-size:10px;color:var(--muted);font-weight:500}
.shelf-card .shelf-name{font-size:14px;font-weight:600;margin-top:2px}
.shelf-status-dot{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%}
.shelf-status-dot.done{background:var(--green-mid)}
.shelf-status-dot.pending{background:#ddd}

/* CHECK PAGE */
#page-check{background:var(--bg)}
.search-bar{padding:10px 14px;background:var(--card);border-bottom:.5px solid var(--border);display:flex;gap:8px;align-items:center;position:sticky;top:57px;z-index:14}
.search-bar input{flex:1;font-family:var(--font);font-size:15px;padding:9px 13px;border-radius:var(--rs);border:.5px solid var(--border2);background:var(--surface);color:var(--text)}
.scan-btn{flex-shrink:0;width:42px;height:42px;border-radius:var(--rs);background:var(--accent);color:#fff;border:none;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.product-list{padding:10px 14px;display:flex;flex-direction:column;gap:8px}

/* PRODUCT ITEM - สถานะ */
.product-item{background:var(--card);border-radius:var(--r);border:.5px solid var(--border);padding:13px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;position:relative;transition:all .15s}
.product-item:active{opacity:.85}

/* บันทึกแล้ว - แสดงสีชัดเจน */
.product-item.status-ok{border:1.5px solid #639922;background:#EAF3DE}
.product-item.status-amber{border:1.5px solid #EF9F27;background:#FAEEDA}
.product-item.status-red{border:1.5px solid #E24B4A;background:#FCEBEB}
/* ยังไม่บันทึก */
.product-item.status-none{border:.5px solid var(--border);background:var(--card)}

.checked-stamp{position:absolute;top:8px;right:8px;background:var(--green-mid);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px}
.checked-stamp.warn{background:var(--amber-mid)}
.checked-stamp.danger{background:var(--red-mid)}

.pi-icon{width:40px;height:40px;border-radius:10px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.pi-body{flex:1;min-width:0}
.pi-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi-sub{font-size:12px;color:var(--muted);margin-top:2px}
.pi-right{text-align:right;flex-shrink:0}
.pi-date{font-size:12px;font-weight:700}
.pi-days{font-size:11px;margin-top:2px}

/* ADMIN */
#page-admin{background:var(--bg)}
.admin-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px 0}
.admin-stat{background:var(--card);border-radius:var(--rs);border:.5px solid var(--border);padding:12px;text-align:center}
.admin-stat .num{font-size:26px;font-weight:700}
.admin-stat .lbl{font-size:11px;color:var(--muted);margin-top:2px}
.admin-stat.red .num{color:var(--red)}
.section-header{font-size:11px;font-weight:600;color:var(--hint);text-transform:uppercase;letter-spacing:.06em;padding:14px 14px 6px}
.shelf-row{background:var(--card);border-radius:var(--r);border:.5px solid var(--border);margin:0 14px 8px;padding:13px 14px;display:flex;align-items:center;gap:12px}
.shelf-row-icon{font-size:24px;flex-shrink:0}
.shelf-row-body{flex:1}
.shelf-row-name{font-size:14px;font-weight:600}
.shelf-row-sub{font-size:12px;color:var(--muted);margin-top:2px}
.history-item{background:var(--card);border-radius:var(--r);border:.5px solid var(--border);margin:0 14px 8px;padding:13px 14px}
.log-entry{padding:8px 0;border-bottom:.5px solid var(--border);display:flex;align-items:center;gap:8px}
.log-entry:last-child{border-bottom:none}
.log-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.log-dot.red{background:var(--red-mid)}
.log-dot.amber{background:var(--amber-mid)}
.log-dot.green{background:var(--green-mid)}

/* MODAL */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:all}
.sheet{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:20px 20px 48px;transform:translateY(100%);transition:transform .25s ease;max-height:90vh;overflow-y:auto}
.overlay.show .sheet{transform:translateY(0)}
.sheet-handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 18px}
.sheet h3{font-size:17px;font-weight:600;margin-bottom:16px}

/* SCANNER */
#scanner-overlay{position:fixed;inset:0;z-index:60;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#scanner-overlay.show{display:flex}
#scanner-video{width:100%;max-width:360px;border-radius:12px;display:block}
.scanner-wrap{position:relative;width:100%;max-width:360px}
.scanner-corner{position:absolute;width:36px;height:36px;border-color:#fff;border-style:solid}
.scanner-corner.tl{top:0;left:0;border-width:3px 0 0 3px;border-radius:4px 0 0 0}
.scanner-corner.tr{top:0;right:0;border-width:3px 3px 0 0;border-radius:0 4px 0 0}
.scanner-corner.bl{bottom:0;left:0;border-width:0 0 3px 3px;border-radius:0 0 0 4px}
.scanner-corner.br{bottom:0;right:0;border-width:0 3px 3px 0;border-radius:0 0 4px 0}
.scanner-line{position:absolute;left:10px;right:10px;top:50%;height:2px;background:rgba(255,80,80,.85);animation:scan 2s linear infinite}
@keyframes scan{0%{top:15%}50%{top:85%}100%{top:15%}}
.scanner-tip{color:#fff;font-size:14px;text-align:center;margin-top:16px;opacity:.8}
.btn-cancel-scan{margin-top:20px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);font-family:var(--font);font-size:15px;padding:12px 32px;border-radius:var(--rs);cursor:pointer}

/* MISC */
.empty{text-align:center;padding:48px 20px;color:var(--hint)}
.empty-icon{font-size:48px;display:block;margin-bottom:10px}
.fab{position:fixed;bottom:24px;right:18px;z-index:30;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.22)}
.month-badge{display:inline-block;background:var(--surface2);border-radius:8px;padding:4px 12px;font-size:13px;font-weight:600;color:var(--muted);margin:8px 14px 0}
.loading{text-align:center;padding:40px;color:var(--muted);font-size:14px}
</style>
</head>
<body>

<!-- PAGE: LOGIN -->
<div id="page-login" class="page active">
  <div class="login-hero">
    <div class="logo">🏪</div>
    <h1>ระบบเช็ควันหมดอายุ</h1>
    <p>กรอกชื่อเพื่อเริ่มงาน</p>
  </div>
  <div class="login-body">
    <h2>ยินดีต้อนรับ</h2>
    <div class="field">
      <label>ชื่อพนักงาน</label>
      <input type="text" id="login-name" placeholder="กรอกชื่อของคุณ..." />
    </div>
    <button class="btn btn-primary" onclick="doLogin()" style="margin-top:8px">เริ่มงาน →</button>
    <div style="margin-top:20px;text-align:center">
      <button class="btn-text" onclick="goAdmin()">🔧 เข้าหน้าผู้จัดการ</button>
    </div>
  </div>
</div>

<!-- PAGE: SHELF -->
<div id="page-shelf" class="page">
  <div class="topbar">
    <button class="btn-back" onclick="showPage('page-login')">←</button>
    <div>
      <h2>เลือกชั้นที่รับผิดชอบ</h2>
      <div class="topbar-sub" id="shelf-user-label"></div>
    </div>
  </div>
  <div style="padding:12px 14px 4px">
    <div class="month-badge" id="shelf-month-label"></div>
    <p style="font-size:13px;color:var(--muted);padding:8px 14px 0">เลือกชั้นที่คุณได้รับมอบหมายเดือนนี้</p>
  </div>
  <div class="shelf-grid" id="shelf-grid"></div>
  <div style="padding:0 14px 20px">
    <button class="btn btn-primary" id="btn-start-check" onclick="startCheck()" disabled>เริ่มเช็คสินค้า →</button>
  </div>
</div>

<!-- PAGE: CHECK -->
<div id="page-check" class="page">
  <div class="topbar">
    <button class="btn-back" onclick="showPage('page-shelf')">←</button>
    <div>
      <h2 id="check-title">เช็คสินค้า</h2>
      <div class="topbar-sub" id="check-sub"></div>
    </div>
    <button class="btn-text" onclick="finishCheck()">เสร็จแล้ว ✓</button>
  </div>
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="🔍 ค้นหาสินค้า..." oninput="renderProducts()" />
    <button class="scan-btn" onclick="openScanner()" title="สแกนบาร์โค้ด">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="17" y="2" width="5" height="5" rx="1"/><rect x="2" y="17" width="5" height="5" rx="1"/><line x1="9" y1="3" x2="9" y2="7"/><line x1="12" y1="3" x2="12" y2="7"/><line x1="15" y1="3" x2="15" y2="7"/><line x1="9" y1="17" x2="9" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/><line x1="15" y1="17" x2="15" y2="21"/><line x1="17" y1="9" x2="21" y2="9"/><line x1="17" y1="12" x2="21" y2="12"/><line x1="17" y1="15" x2="21" y2="15"/><line x1="3" y1="9" x2="7" y2="9"/><line x1="3" y1="12" x2="7" y2="12"/><line x1="3" y1="15" x2="7" y2="15"/></svg>
    </button>
  </div>
  <div class="product-list" id="product-list"></div>
</div>

<!-- PAGE: ADMIN -->
<div id="page-admin" class="page">
  <div class="topbar">
    <button class="btn-back" onclick="showPage('page-login')">←</button>
    <h2>หน้าผู้จัดการ</h2>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchAdminTab('overview',this)">ภาพรวม</button>
    <button class="tab" onclick="switchAdminTab('products',this)">สินค้า</button>
    <button class="tab" onclick="switchAdminTab('history',this)">ประวัติ</button>
    <button class="tab" onclick="switchAdminTab('export',this)">ส่งออก</button>
  </div>
  <div id="admin-overview" class="admin-tab"></div>
  <div id="admin-products" class="admin-tab" style="display:none"></div>
  <div id="admin-history" class="admin-tab" style="display:none"></div>
  <div id="admin-export" class="admin-tab" style="display:none"></div>
  <button class="fab" id="admin-fab" onclick="openAddProduct()">＋</button>
</div>

<!-- MODAL: บันทึกวันหมดอายุ -->
<div class="overlay" id="modal-log" onclick="closeIfBg(event,'modal-log')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3 id="log-product-name"></h3>
    <p style="font-size:13px;color:var(--muted);margin-bottom:16px" id="log-product-barcode"></p>
    <div class="field">
      <label>วันหมดอายุ *</label>
      <div style="display:flex;gap:8px;align-items:center">
        <input type="date" id="log-date" style="flex:1" />
        <button onclick="openPhotoCapture()" title="ถ่ายรูปวันหมดอายุ" style="flex-shrink:0;width:44px;height:44px;border-radius:var(--rs);background:var(--surface2);border:.5px solid var(--border2);font-size:20px;cursor:pointer">📷</button>
      </div>
    </div>
    <div class="field">
      <label>หมายเหตุ (ถ้ามี)</label>
      <input type="text" id="log-note" placeholder="เช่น เปิดแล้ว, ชำรุด..." />
    </div>
    <button class="btn btn-primary" onclick="saveLog()">✓ บันทึก</button>
    <button class="btn btn-outline" style="margin-top:8px" onclick="closeModal('modal-log')">ยกเลิก</button>
  </div>
</div>

<!-- MODAL: เพิ่มสินค้า -->
<div class="overlay" id="modal-product" onclick="closeIfBg(event,'modal-product')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3 id="modal-product-title">เพิ่มสินค้า</h3>
    <div class="field">
      <label>ชื่อสินค้า *</label>
      <input type="text" id="prod-name" placeholder="ชื่อสินค้า..." />
    </div>
    <div class="field-row">
      <div class="field">
        <label>บาร์โค้ด</label>
        <input type="text" id="prod-barcode" placeholder="ไม่บังคับ" />
      </div>
      <div class="field">
        <label>ชั้นที่วาง</label>
        <select id="prod-shelf"></select>
      </div>
    </div>
    <div class="field">
      <label>หมวดหมู่</label>
      <select id="prod-cat">
        <option>🧁 เบเกอรี่</option>
        <option>🥛 นม/ครีม</option>
        <option>🧴 สารเสริม</option>
        <option>🧈 แป้ง/เนย</option>
        <option>🍖 หมูหยอง/ฟิลลิ่ง</option>
        <option>❄️ แช่แข็ง</option>
        <option>📦 อื่นๆ</option>
      </select>
    </div>
    <input type="hidden" id="prod-edit-id" />
    <button class="btn btn-primary" onclick="saveProduct()">✓ บันทึกสินค้า</button>
    <button class="btn btn-outline" style="margin-top:8px" onclick="closeModal('modal-product')">ยกเลิก</button>
  </div>
</div>

<!-- SCANNER -->
<div id="scanner-overlay">
  <div style="color:#fff;font-size:18px;font-weight:600;margin-bottom:16px">สแกนบาร์โค้ด</div>
  <div class="scanner-wrap">
    <video id="scanner-video" autoplay playsinline muted></video>
    <div class="scanner-corner tl"></div>
    <div class="scanner-corner tr"></div>
    <div class="scanner-corner bl"></div>
    <div class="scanner-corner br"></div>
    <div class="scanner-line"></div>
  </div>
  <p class="scanner-tip">จ่อบาร์โค้ดให้ตรงกรอบ</p>
  <button class="btn-cancel-scan" onclick="closeScanner()">✕ ยกเลิก</button>
  <button id="scanner-manual-btn" onclick="manualBarcodeInput()" style="display:none;margin-top:10px;background:rgba(255,255,255,.25);color:#fff;border:1px solid rgba(255,255,255,.4);font-family:var(--font);font-size:14px;padding:10px 24px;border-radius:var(--rs);cursor:pointer">⌨️ พิมพ์บาร์โค้ดเอง</button>
</div>

<!-- PHOTO OVERLAY -->
<div id="photo-overlay" style="position:fixed;inset:0;z-index:70;background:#000;display:none;flex-direction:column;align-items:center;justify-content:flex-start;padding:20px;overflow-y:auto">
  <div style="color:#fff;font-size:18px;font-weight:600;margin-bottom:12px;width:100%;max-width:400px">📷 ถ่ายรูปวันหมดอายุ</div>
  <div style="position:relative;width:100%;max-width:400px">
    <video id="photo-video" autoplay playsinline muted style="width:100%;border-radius:12px;display:block"></video>
    <canvas id="photo-canvas" style="width:100%;border-radius:12px;display:none"></canvas>
  </div>
  <div id="photo-result" style="width:100%;max-width:400px"></div>
  <div style="display:flex;gap:10px;margin-top:14px;width:100%;max-width:400px">
    <button onclick="capturePhoto()" style="flex:1;background:#fff;color:#1a1a1a;border:none;border-radius:var(--rs);padding:13px;font-family:var(--font);font-size:15px;font-weight:600;cursor:pointer">📸 ถ่ายภาพ</button>

function daysDiff(ds){const t=today();const e=new Date(ds);e.setHours(0,0,0,0);return Math.round((e-t)/86400000)}

// ── PRODUCTS ──
function getLogForProduct(productId){
  const mk=monthKey();
  return logs.find(l=>l.productId===productId&&l.shelfId===currentShelf&&l.monthKey===mk);
}
function renderProducts(){
  const q=document.getElementById('search-input').value.trim().toLowerCase();
  const shelfProds=products.filter(p=>p.shelfId===currentShelf);
  const filtered=q?shelfProds.filter(p=>p.name.toLowerCase().includes(q)||(p.barcode&&p.barcode.includes(q))):shelfProds;
  const el=document.getElementById('product-list');
  if(!filtered.length){
    el.innerHTML=`<div class="empty"><span class="empty-icon">📦</span><p>${q?'ไม่พบสินค้า':'ยังไม่มีสินค้าในชั้นนี้'}</p></div>`;
    return;
  }
  // แยกบันทึกแล้ว/ยังไม่บันทึก
  const logged=filtered.filter(p=>getLogForProduct(p.id));
  const notLogged=filtered.filter(p=>!getLogForProduct(p.id));
  const sorted=[...notLogged,...logged];

  el.innerHTML=sorted.map(p=>{
    const log=getLogForProduct(p.id);
    let cls='status-none',stamp='',rightHtml='<span style="font-size:22px;color:var(--hint)">›</span>';
    if(log){
      const d=daysDiff(log.expDate);
      const st=getStatus(d);
      cls=st==='red'?'status-red':st==='amber'?'status-amber':'status-ok';
      const stampCls=st==='red'?'danger':st==='amber'?'warn':'';
      const dLabel=d<0?`เกิน ${Math.abs(d)} วัน`:d===0?'หมดวันนี้!':d===1?'พรุ่งนี้!':d<=60?`อีก ${d} วัน`:`อีก ${d} วัน`;
      const expStr=new Date(log.expDate).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'});
      stamp=`<div class="checked-stamp ${stampCls}">✓ บันทึกแล้ว</div>`;
      rightHtml=`<div class="pi-date" style="color:${st==='red'?'var(--red)':st==='amber'?'var(--amber)':'var(--green)'}">${expStr}</div><div class="pi-days" style="color:${st==='red'?'var(--red)':st==='amber'?'var(--amber)':'var(--green)'}">${dLabel}</div>`;
    }
    return`<div class="product-item ${cls}" onclick="openLogModal('${p.id}')">
      ${stamp}
      <div class="pi-icon">${p.cat?p.cat.split(' ')[0]:'📦'}</div>
      <div class="pi-body">
        <div class="pi-name">${escH(p.name)}</div>
        <div class="pi-sub">${p.barcode?'#'+p.barcode:'ไม่มีบาร์โค้ด'}</div>
      </div>
      <div class="pi-right">${rightHtml}</div>
    </div>`;
  }).join('');
}

window.finishCheck = function(){

// ── SCANNER (getUserMedia วิธี 1+2) ──
let scannerStream = null;
let scannerInterval = null;

window.openScanner = async function(){
  document.getElementById('scanner-overlay').classList.add('show');
  const video = document.getElementById('scanner-video');
  try {
    // วิธี 1 ก่อน ถ้าไม่ได้ fallback วิธี 2
    try {
      scannerStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    } catch(e1) {
      scannerStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{exact:'environment'}},audio:false});
    }
    video.srcObject = scannerStream;
    // ใช้ BarcodeDetector ถ้ามี ไม่งั้น fallback manual
    if('BarcodeDetector' in window){
      const bd = new BarcodeDetector({formats:['ean_13','ean_8','code_128','code_39','upc_a','upc_e']});
      scannerInterval = setInterval(async()=>{
        if(video.readyState === video.HAVE_ENOUGH_DATA){
          try{
            const results = await bd.detect(video);
            if(results.length > 0){
              closeScanner();
              searchByBarcode(results[0].rawValue);
            }
          }catch(e){}
        }
      }, 400);
    }
    // ถ้าไม่มี BarcodeDetector แสดงปุ่มพิมพ์เอง
    else {
      document.getElementById('scanner-manual-btn').style.display='block';
    }
  } catch(e) {
    closeScanner();
    const q = prompt('ไม่สามารถเปิดกล้องได้ ('+e.message+')\nป้อนบาร์โค้ดด้วยตนเอง:');
    if(q) searchByBarcode(q.trim());
  }
}
window.closeScanner = function(){
  document.getElementById('scanner-overlay').classList.remove('show');
  document.getElementById('scanner-manual-btn').style.display='none';
  if(scannerInterval){clearInterval(scannerInterval);scannerInterval=null;}
  if(scannerStream){scannerStream.getTracks().forEach(t=>t.stop());scannerStream=null;}
  const video=document.getElementById('scanner-video');
  video.srcObject=null;
}
window.manualBarcodeInput = function(){
  const q=prompt('ป้อนบาร์โค้ด:');
  if(q){closeScanner();searchByBarcode(q.trim());}
}
function searchByBarcode(code){
  document.getElementById('search-input').value=code;
  renderProducts();
  const match=products.find(p=>p.barcode===code&&p.shelfId===currentShelf);
  if(match)openLogModal(match.id);
  else alert(`ไม่พบสินค้าบาร์โค้ด: ${code}\nในชั้นนี้`);
}

window.openPhotoCapture = async function(){

window.closePhotoCapture = function(){
  document.getElementById('photo-overlay').style.display='none';
  document.getElementById('photo-result').innerHTML='';

window.capturePhoto = async function(){
  const video = document.getElementById('photo-video');
  const canvas = document.getElementById('photo-canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);
  canvas.style.display='block';
  video.style.display='none';
  const resultEl = document.getElementById('photo-result');
  resultEl.innerHTML='<div style="color:#fff;text-align:center;padding:12px">🤖 AI กำลังอ่านวันหมดอายุ...</div>';
  const base64 = canvas.toDataURL('image/jpeg',0.85).split(',')[1];
  try{
    const resp = await fetch('https://expiry-api.sandtanin.workers.dev/',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({imageBase64:base64})
    });
    const data = await resp.json();
    const text = data.content?.[0]?.text||'{}';
    let parsed;
    try{ parsed=JSON.parse(text.trim()); }catch(e){ parsed={found:false}; }
    if(parsed.found && parsed.date){
      resultEl.innerHTML=`<div style="background:#EAF3DE;border-radius:10px;padding:14px;text-align:center;margin-top:8px">
        <div style="font-size:13px;color:#3B6D11;font-weight:600">✓ พบวันหมดอายุ</div>
        <div style="font-size:22px;font-weight:700;color:#1a1a1a;margin:6px 0">${new Date(parsed.date).toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'})}</div>
        <button onclick="applyPhotoDate('${parsed.date}')" style="background:#1a1a1a;color:#fff;border:none;border-radius:8px;padding:10px 24px;font-size:14px;font-weight:600;cursor:pointer;width:100%;margin-top:4px">✓ ใช้วันนี้</button>
      </div>`;
    } else {
      resultEl.innerHTML=`<div style="background:#FCEBEB;border-radius:10px;padding:14px;text-align:center;margin-top:8px">
        <div style="font-size:13px;color:#A32D2D;font-weight:600">ไม่พบวันหมดอายุในภาพ</div>
        <button onclick="retakePhoto()" style="background:#1a1a1a;color:#fff;border:none;border-radius:8px;padding:10px 24px;font-size:14px;font-weight:600;cursor:pointer;width:100%;margin-top:8px">📷 ถ่ายใหม่</button>
      </div>`;
    }
  }catch(e){
    resultEl.innerHTML=`<div style="color:#f88;text-align:center;padding:8px">เกิดข้อผิดพลาด: ${e.message}<br><button onclick="retakePhoto()" style="margin-top:8px;background:#333;color:#fff;border:none;border-radius:8px;padding:8px 20px;cursor:pointer">ถ่ายใหม่</button></div>`;
  }
}
window.retakePhoto = function(){
  const video=document.getElementById('photo-video');
  const canvas=document.getElementById('photo-canvas');
  canvas.style.display='none';
  video.style.display='block';
  document.getElementById('photo-result').innerHTML='';
}
window.applyPhotoDate = function(date){
  document.getElementById('log-date').value=date;
  closePhotoCapture();
}

      const logDate=new Date(l.loggedAt).toLocaleDateString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
      return`<div class="log-entry">
        <div class="log-dot ${st}"></div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p?escH(p.name):'(ลบแล้ว)'}</div>
          <div style="font-size:11px;color:var(--muted)">${shelfById(l.shelfId).icon} ชั้น ${l.shelfId} · ${logDate}</div>
        </div>
        <div style="text-align:right;flex-shrink:0;font-size:12px;font-weight:600;color:${st==='red'?'var(--red)':st==='amber'?'var(--amber)':'var(--green)'}">${expStr}</div>
      </div>`;
    }).join('');
    html+=`<div class="history-item" style="margin:0 14px 8px"><div style="font-size:14px;font-weight:600;margin-bottom:8px">👤 ${escH(user)} <span style="font-size:12px;font-weight:400;color:var(--muted)">${ulogs.length} รายการ</span></div>${rows}</div>`;
  });
  el.innerHTML=html;
}
function renderExport(){
  document.getElementById('admin-export').innerHTML=`<div style="padding:20px 14px;display:flex;flex-direction:column;gap:12px">
    <div class="card"><div style="font-size:15px;font-weight:600;margin-bottom:6px">📊 ส่งออก Excel</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:12px">รายการเช็ควันหมดอายุเดือนนี้</div>
    <button class="btn btn-primary" onclick="exportExcel()">⬇️ ดาวน์โหลด Excel</button></div>
    <div class="card"><div style="font-size:15px;font-weight:600;margin-bottom:6px">🖨️ ส่งออก PDF</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:12px">เปิดหน้าต่างพิมพ์เพื่อบันทึกเป็น PDF</div>
    <button class="btn btn-outline" onclick="exportPrint()">🖨️ พิมพ์ / บันทึก PDF</button></div>
  </div>`;
}

// ── PRODUCT CRUD ──
function populateShelfSelect(selectedId){
  const sel=document.getElementById('prod-shelf');
  sel.innerHTML=SHELVES.map(s=>`<option value="${s.id}"${s.id===selectedId?' selected':''}>${s.icon} ชั้น ${s.id} · ${s.name}</option>`).join('');
}
window.openAddProduct = function(){
  document.getElementById('modal-product-title').textContent='เพิ่มสินค้า';
  document.getElementById('prod-name').value='';
  document.getElementById('prod-barcode').value='';
  document.getElementById('prod-edit-id').value='';
  populateShelfSelect(SHELVES[0].id);
  openModal('modal-product');
}
window.editProduct = function(id){
  const p=products.find(x=>x.id===id);if(!p)return;
  document.getElementById('modal-product-title').textContent='แก้ไขสินค้า';
  document.getElementById('prod-name').value=p.name;
  document.getElementById('prod-barcode').value=p.barcode||'';
  document.getElementById('prod-edit-id').value=p.id;
  populateShelfSelect(p.shelfId);
  const catSel=document.getElementById('prod-cat');
  for(let i=0;i<catSel.options.length;i++){if(catSel.options[i].value===p.cat)catSel.selectedIndex=i}
  openModal('modal-product');
}
window.saveProduct = async function(){
  const name=document.getElementById('prod-name').value.trim();
  const barcode=document.getElementById('prod-barcode').value.trim();
  const shelfId=parseInt(document.getElementById('prod-shelf').value);
  const cat=document.getElementById('prod-cat').value;
  const editId=document.getElementById('prod-edit-id').value;
  if(!name){alert('กรุณากรอกชื่อสินค้า');return}
  const id=editId||'prod_'+Date.now();
  await setDoc(doc(db,'products',id),{name,barcode,shelfId,cat});
  closeModal('modal-product');
}
window.deleteProduct = async function(id){
  if(!confirm('ลบสินค้านี้?'))return;
  await deleteDoc(doc(db,'products',id));
}

// ── EXPORT ──
window.exportExcel = function(){
  const mk=monthKey();
  const rows=[['วันที่บันทึก','พนักงาน','ชั้น','ชื่อสินค้า','บาร์โค้ด','วันหมดอายุ','สถานะ','หมายเหตุ']];
  logs.filter(l=>l.monthKey===mk).sort((a,b)=>new Date(a.loggedAt)-new Date(b.loggedAt)).forEach(l=>{
    const p=products.find(x=>x.id===l.productId);
    const sh=shelfById(l.shelfId);
    const d=daysDiff(l.expDate);
    rows.push([new Date(l.loggedAt).toLocaleDateString('th-TH'),l.user,`ชั้น ${l.shelfId} ${sh.name}`,p?p.name:'?',p?p.barcode||'':'',new Date(l.expDate).toLocaleDateString('th-TH'),d<0?'หมดอายุ':d<=60?'ใกล้หมด':'ปลอดภัย',l.note||'']);
  });
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:14},{wch:12},{wch:16},{wch:24},{wch:14},{wch:14},{wch:12},{wch:20}];
  XLSX.utils.book_append_sheet(wb,ws,'เช็ควันหมดอายุ');
  XLSX.writeFile(wb,`expiry_${mk}.xlsx`);
}
window.exportPrint = function(){
  const mk=monthKey();
  const ml=logs.filter(l=>l.monthKey===mk).sort((a,b)=>new Date(a.loggedAt)-new Date(b.loggedAt));
  const rows=ml.map(l=>{
    const p=products.find(x=>x.id===l.productId);
    const sh=shelfById(l.shelfId);
    const d=daysDiff(l.expDate);
    return`<tr><td>${new Date(l.loggedAt).toLocaleDateString('th-TH')}</td><td>${l.user}</td><td>ชั้น ${l.shelfId} ${sh.name}</td><td>${p?p.name:'?'}</td><td>${new Date(l.expDate).toLocaleDateString('th-TH')}</td><td>${d<0?'🔴 หมดอายุ':d<=60?'🟡 ใกล้หมด':'🟢 ปลอดภัย'}</td><td>${l.note||'-'}</td></tr>`;
  }).join('');
  const w=window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>รายงาน</title><style>body{font-family:sans-serif;font-size:12px;padding:20px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:6px;text-align:left}th{background:#f0f0f0}@media print{body{padding:0}}</style></head><body><h2>รายงานเช็ควันหมดอายุ · ${monthLabel()}</h2><table><thead><tr><th>วันที่</th><th>พนักงาน</th><th>ชั้น</th><th>สินค้า</th><th>วันหมดอายุ</th><th>สถานะ</th><th>หมายเหตุ</th></tr></thead><tbody>${rows||'<tr><td colspan="7" style="text-align:center">ไม่มีข้อมูล</td></tr>'}</tbody></table></body></html>`);
  w.document.close();w.print();
}

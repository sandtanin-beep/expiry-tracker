<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ทดสอบอ่านวันหมดอายุ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#111;color:#fff;padding:16px;min-height:100vh}
h2{font-size:17px;margin-bottom:6px;text-align:center}
p{font-size:12px;color:#aaa;text-align:center;margin-bottom:14px}
button{display:block;width:100%;padding:13px;margin-bottom:8px;font-size:14px;border-radius:10px;border:none;cursor:pointer;font-weight:600}
.btn-primary{background:#fff;color:#111}
.btn-stop{background:#333;color:#fff}
video{width:100%;border-radius:10px;background:#000;display:block;margin:8px 0}
canvas{width:100%;border-radius:10px;margin:8px 0}
#result{background:#1a1a1a;border-radius:10px;padding:12px;font-size:13px;min-height:60px;margin-top:8px;white-space:pre-wrap;word-break:break-all;line-height:1.6}
.ok{color:#7CCA5A}
.err{color:#FF6B6B}
.info{color:#FFD166}
.date-box{background:#1e3a1e;border:1px solid #7CCA5A;border-radius:10px;padding:14px;text-align:center;margin-top:8px}
.date-box .date{font-size:24px;font-weight:700;color:#7CCA5A;margin:6px 0}
</style>
</head>
<body>
<h2>📷 ทดสอบอ่านวันหมดอายุ</h2>
<p>ทดสอบผ่าน Cloudflare Worker</p>

<button class="btn-primary" onclick="openCam()">📷 เปิดกล้อง</button>
<button class="btn-primary" id="btn-capture" onclick="captureAndRead()" style="display:none;background:#FFD166;color:#111">📸 ถ่ายภาพและอ่านวัน</button>
<button class="btn-primary" onclick="document.getElementById('file-input').click()">🖼️ เลือกรูปจากคลัง</button>
<button class="btn-stop" onclick="stopCam()">⏹ หยุดกล้อง</button>
<input type="file" id="file-input" accept="image/*" style="display:none" onchange="readFromFile(this)">

<video id="vid" autoplay playsinline muted style="display:none"></video>
<canvas id="cvs" style="display:none"></canvas>
<div id="result">กดเปิดกล้องหรือเลือกรูปเพื่อทดสอบ...</div>

<script>
const WORKER_URL = 'https://expiry-api.sandtanin.workers.dev/';
let stream = null;

const log = (msg, type='') => {
  document.getElementById('result').innerHTML += `<span class="${type}">${msg}</span>\n`;
};
const clearLog = () => { document.getElementById('result').innerHTML = ''; };

async function openCam(){
  clearLog();
  try{
    try{
      stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    }catch(e){
      stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{exact:'environment'}},audio:false});
    }
    const vid = document.getElementById('vid');
    vid.srcObject = stream;
    vid.style.display = 'block';
    document.getElementById('btn-capture').style.display = 'block';
    log('✓ กล้องเปิดได้ กดถ่ายภาพได้เลย','ok');
  }catch(e){
    log('✗ เปิดกล้องไม่ได้: '+e.message,'err');
  }
}

function stopCam(){
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  document.getElementById('vid').style.display='none';
  document.getElementById('vid').srcObject=null;
  document.getElementById('btn-capture').style.display='none';
  document.getElementById('cvs').style.display='none';
  log('⏹ หยุดกล้องแล้ว','info');
}

async function captureAndRead(){
  const vid = document.getElementById('vid');
  const cvs = document.getElementById('cvs');
  cvs.width = vid.videoWidth;
  cvs.height = vid.videoHeight;
  cvs.getContext('2d').drawImage(vid, 0, 0);
  cvs.style.display = 'block';
  stopCam();
  const base64 = cvs.toDataURL('image/jpeg', 0.92).split(',')[1];
  await sendToWorker(base64);
}

async function readFromFile(input){
  if(!input.files[0]) return;
  clearLog();
  log('กำลังอ่านรูป...','info');
  const reader = new FileReader();
  reader.onload = async(e) => {
    const base64 = e.target.result.split(',')[1];
    const img = new Image();
    img.onload = () => {
      const cvs = document.getElementById('cvs');
      cvs.width = img.width; cvs.height = img.height;
      cvs.getContext('2d').drawImage(img,0,0);
      cvs.style.display='block';
    };
    img.src = e.target.result;
    await sendToWorker(base64);
  };
  reader.readAsDataURL(input.files[0]);
}

async function sendToWorker(base64){
  clearLog();
  log('📡 กำลังส่งรูปไปให้ AI อ่าน...','info');
  log('ขนาดรูป: '+Math.round(base64.length/1024)+' KB','info');
  try{
    const resp = await fetch(WORKER_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({imageBase64: base64})
    });
    log('HTTP Status: '+resp.status, resp.ok?'ok':'err');
    const text = await resp.text();
    log('Response raw: '+text,'info');
    let parsed;
    try{ parsed = JSON.parse(text); }catch(e){ log('✗ Parse JSON ไม่ได้: '+e.message,'err'); return; }
    if(parsed.found && parsed.date){
      const dateStr = new Date(parsed.date).toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'});
      document.getElementById('result').innerHTML += `<div class="date-box"><div style="font-size:12px;color:#7CCA5A">✓ พบวันหมดอายุ</div><div class="date">${dateStr}</div><div style="font-size:11px;color:#aaa">${parsed.date}</div></div>`;
    } else if(parsed.error){
      log('✗ Worker Error: '+parsed.error,'err');
    } else {
      log('✗ ไม่พบวันหมดอายุในภาพ','err');
      log('ลองถ่ายให้ชัดขึ้น หรือให้เห็นตัวเลขวันหมดอายุชัดๆ','info');
    }
  }catch(e){
    log('✗ เกิดข้อผิดพลาด: '+e.message,'err');
    log('ตรวจสอบว่า Worker URL ถูกต้องไหม','info');
  }
}
</script>
</body>
</html>
